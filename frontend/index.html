<!DOCTYPE html>

<html>

    <head>
        <title>Projeto Powerpolis</title>

        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <meta http-equiv="X-UA-Compatible" content="IE=edge">

        <meta
            name="Projeto Powerpolis"
            content="Projeto de avaliação de eficiência energética de empresas."
        >

        <link
            rel="icon"
            href="powerpolis-logo.png"
            type="image/logo"
        >

        <link
            rel="stylesheet"
            href="style.css"
        >

        <script
            src="script.js"
            defer
        ></script>

        <script src="city.js" defer></script>

    </head>

    <body>
        <header>     
            <nav id="navbar-container"></nav>
        </header>
        
        <main>
            <h1>Projeto Powerpolis</h1>

            <section class="city-section">

                <div class="city-header">

                    <h2>Simulação de Consumo Energético</h2>

                    <p>
                        Ajuste o consumo mensal da empresa e observe o impacto visual
                        na cidade.
                    </p>

                </div>


                <div class="city-container">

                    <svg
                        id="smart-city"
                        viewBox="0 0 1200 500"
                        preserveAspectRatio="xMidYMid meet"
                    >

                        <!-- Céu -->

                        <rect
                            width="1200"
                            height="500"
                            class="city-sky"
                        />

                        <!-- Solo -->

                        <rect
                            y="420"
                            width="1200"
                            height="80"
                            class="city-ground"
                        />

                        <!-- Grupo onde ficarão os prédios -->

                        <g id="buildings"></g>

                    </svg>

                </div>


                <div class="energy-control">

                    <label for="energySlider">

                        Consumo Energético

                    </label>

                    <input

                        type="range"

                        id="energySlider"

                        min="0"

                        max="100"

                        value="50"

                    >

                    <span id="energyValue">

                        50%

                    </span>

                </div>

            </section>
        </main>

        <footer>

            <div class="footer-logo">
                <h2>Powerpolis</h2>
                <p>Soluções inteligentes para gerenciamento energético.</p>
            </div>

            <div class="footer-social">

                <a href="#">GitHub</a>
                
            </div>

            <div class="footer-copy">

                <p>© 2026 Powerpolis. Todos os direitos reservados.</p>

            </div>

        </footer>


        <script>
        fetch('navbar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('navbar-container').innerHTML = data;
            })
            .catch(error => console.error('Error loading the navbar:', error));
        </script>
    </body>



</html>
