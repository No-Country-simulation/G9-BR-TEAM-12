<!DOCTYPE html>

<html>

    <head>
        <title>Projeto Powerpolis</title>

        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <meta http-equiv="X-UA-Compatible" content="IE=edge">

        <meta
            name="Projeto Powerpolis"
            content="Projeto de avaliação de eficiência energética de empresas."
        >

        <link
            rel="icon"
            href="powerpolis-logo.png"
            type="image/logo"
        >

        <link
            rel="stylesheet"
            href="style.css"
        >

        <script
            src="script.js"
            defer
        ></script>

    </head>

    <body>
        <header>     
            <nav id="navbar-container"></nav>
        </header>
        
        <main>
            <h1>Projeto Powerpolis</h1>
        </main>


        <script>
        fetch('navbar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('navbar-container').innerHTML = data;
            })
            .catch(error => console.error('Error loading the navbar:', error));
        </script>
    </body>



</html>
