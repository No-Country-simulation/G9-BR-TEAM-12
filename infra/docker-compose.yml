# ==============================================================================
# ARCHITECTURE: Aplicação Multi-Serviço (Backend + Model Service)
# DESCRIÇÃO: Orquestração de containers para ambiente local/desenvolvimento.
# ==============================================================================

services:

  # ----------------------------------------------------------------------------
  # Microserviço de Ciência de Dados / Machine Learning
  # ----------------------------------------------------------------------------
  model-service:
    # Nome explícito para facilitar identificação e logs via 'docker ps'
    container_name: app_model_service

    # Caminho do contexto de build relativo a este arquivo docker-compose
    build:
      context: ../data-science/app
      dockerfile: Dockerfile

    # Mapeamento de portas: <Porta do Host>:<Porta do Container>
    ports:
      - "8000:8000"

    # Variáveis de ambiente para o model_loader
    environment:
      - MODEL_SOURCE=local
      - MODEL_LOCAL_PATH=models/modelo_energiai_v1.pkl

    # Isolamento de rede (utiliza a rede definida ao final do arquivo)
    networks:
      - app-network

    # Reinicia o container automaticamente caso ocorra falha
    restart: unless-stopped


  # ----------------------------------------------------------------------------
  # Aplicação Principal / Backend
  # ----------------------------------------------------------------------------
  backend:
    container_name: app_backend

    build:
      context: ../backend
      dockerfile: Dockerfile

    ports:
      - "9091:9091"

    # Variáveis de ambiente
    # Nota: Usamos o nome do serviço 'model-service' como hostname interno do Docker
    environment:
      - MODEL_SERVICE_URL=http://model-service:8000
      - NODE_ENV=development # Exemplo: Ajuste conforme sua stack (development/production)

    # Ordem de inicialização: o backend aguardará a criação do model-service
    depends_on:
      - model-service

    networks:
      - app-network

    restart: unless-stopped


# ----------------------------------------------------------------------------
  # Aplicação Frontend / React + Vite + Nginx
  # ----------------------------------------------------------------------------
  frontend:
    container_name: app_frontend

    build:
      context: ../innokrea/frontend
      dockerfile: Dockerfile
      args:
        VITE_APP_BACKEND_ADDRESS: http://localhost:9091

    ports:
      - "3000:3000"

    depends_on:
      - backend

    networks:
      - app-network

    restart: unless-stopped

# ==============================================================================
# NETWORKS (REDES)
# Cria uma rede isolada do tipo bridge para que os serviços se comuniquem
# pelo nome do serviço (DNS interno do Docker).
# ==============================================================================
networks:
  app-network:
    driver: bridge
